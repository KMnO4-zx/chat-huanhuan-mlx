# Run 2 - FRESH start with a conservative recipe (run1's adapter was net-negative).
#
# Why fresh instead of resuming run1:
#   run1 scored 7.555 vs base 8.539 under the benchmark's recommended decoding,
#   and even under greedy decoding (10-case probe) run1 8.815 < base 8.980.
#   Its weights are net-negative, so resuming would inherit the damage.
#
# Changes vs run1 (see IMPROVEMENTS.md):
#   * TRAINING SET  : data/v2 = instruction-deduped corpus + 34 adversarial
#                     defenses + 20 canon-flavored lines (no benchmark leakage)
#   * TRAINING PARAM: scale 20 -> 16, dropout 0.05 -> 0.1, constant lr 1e-4 ->
#                     cosine 4e-5 -> 4e-6 with warmup (effective step
#                     lr*scale drops from 2e-3 to 6.4e-4, ~3x gentler), which
#                     run1 showed was needed to avoid probability distortion;
#                     LoRA keys limited to q/k/v/o/gate/up (excl. down_proj),
#                     matching the reference config and cutting trainable
#                     params 10.1M -> 8.26M; batch 8 -> 4 and max_seq 512 -> 320
#                     to keep peak memory under ~6GB (run1 peaked at 13.25GB
#                     and drove the system into swap)
#   * OTHER         : train_entry.py wires clear_cache_threshold=12GB; runner
#                     enforces a real 20-minute hard timeout
#   * PROMPT        : unchanged
model: models/Qwen3-0.6B-mlx
train: true
data: data/v2
fine_tune_type: lora
optimizer: adamw

num_layers: -1
lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.v_proj
    - self_attn.k_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
  rank: 16
  dropout: 0.1
  scale: 16.0

batch_size: 4
iters: 500
lr_schedule:
  name: cosine_decay
  arguments: [4.0e-5, 500, 4.0e-6]
  warmup: 25
  warmup_init: 0.0

val_batches: 15
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 320
grad_checkpoint: false
grad_accumulation_steps: 1
mask_prompt: true
seed: 42
