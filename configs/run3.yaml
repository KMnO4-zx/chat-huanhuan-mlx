# Run 3 - fresh conservative LoRA on quality-filtered data/v3.
#
# Why fresh (no resume_adapter_file): run1 and run2 adapters both scored
# below base on the benchmark, so their weights are discarded. The lesson
# from run2 is that the *data* was the bottleneck (49% of replies <=20
# chars, no speaker labels), not the LR schedule; v3 fixes the data and
# keeps the memory-safe recipe.
model: models/Qwen3-0.6B-mlx
train: true
data: data/v3
fine_tune_type: lora
optimizer: adamw

num_layers: -1
lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.v_proj
    - self_attn.k_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
  rank: 16
  dropout: 0.1
  scale: 16.0

# Fresh start: run1/run2 adapters are net-negative, not resumed.
batch_size: 4
iters: 400
lr_schedule:
  name: cosine_decay
  arguments: [3.0e-5, 400, 3.0e-6]
  warmup: 20
  warmup_init: 0.0

# data/v3 has only 39 valid samples (~10 batches), so val_batches=10
# evaluates the whole held-out split each time.
val_batches: 10
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 384
grad_checkpoint: false
grad_accumulation_steps: 1
mask_prompt: true
seed: 42
