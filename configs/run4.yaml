# Run 4 - refusal polish: continue run3's adapter on refusal-heavy data/v4.
#
# Why resume: run3 already BEATS base on organic categories (greeting,
# wisdom, rivalry) and on relevance/persona_markers; only modern/meta
# compliance lags. A fresh restart would throw those gains away. We inject
# refusal behaviour with a low LR delta so the organic capability is kept.
#
# Why v4: 74 hand-written imperative-framed refusals ("帮我写代码",
# "用英文说", "点外卖" -> in-character 不知/何物) oversampled 3x, mixed
# with the organic majority (73%) so the model learns to refuse *only*
# off-world requests rather than refusing everything.
model: models/Qwen3-0.6B-mlx
train: true
data: data/v4
fine_tune_type: lora
optimizer: adamw

num_layers: -1
lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.v_proj
    - self_attn.k_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
  rank: 16
  dropout: 0.1
  scale: 16.0

resume_adapter_file: outputs/adapters/run3/adapters.safetensors

batch_size: 4
iters: 350
lr_schedule:
  name: cosine_decay
  arguments: [2.0e-5, 350, 2.0e-6]
  warmup: 15
  warmup_init: 0.0

# data/v4 has 53 valid samples (~13 batches).
val_batches: 13
steps_per_report: 10
steps_per_eval: 100
save_every: 50
max_seq_length: 384
grad_checkpoint: false
grad_accumulation_steps: 1
mask_prompt: true
seed: 42
